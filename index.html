<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Cartoon Network Arabic - Live</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
  <style>
    body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 900px; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="container" data-shaka-player-container>
    <video data-shaka-player id="video" autoplay></video>
  </div>

  <script>
    const manifestUri = 'https://ev-eu-hw-fast-mpd.starzplayarabia.com/Cartoon_Network_Arabic/dash/drm/index.mpd';

    async function initApp() {
      shaka.polyfill.installAll();
      const video = document.getElementById('video');
      const ui = video['ui'];
      const controls = ui.getControls();
      const player = controls.getPlayer();

      // ===============================================================
      // إعدادات التشفير DRM (اختر إحدى الطريقتين ليعمل الصوت والصورة)
      // ===============================================================
      player.configure({
        drm: {
          // الخيار الأول: استخدام مفاتيح ClearKey المباشرة (إذا قمت باستخراجها)
          clearKeys: {
            // 'KID_HEX_HERE': 'KEY_HEX_HERE'
          },

          // الخيار الثاني: استخدام سيرفر التراخيص (Widevine License Server)
          servers: {
            'com.widevine.alpha': 'https://YOUR_LICENSE_SERVER_URL'
          }
        }
      });

      // لإرسال Headers أو Tokens مع طلب التراخيص إذا لزم الأمر:
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
          // request.headers['Authorization'] = 'Bearer YOUR_TOKEN';
        }
      });

      try {
        await player.load(manifestUri);
        console.log('تم تحميل الفيديو وتفكيك التشفير بنجاح.');
      } catch (error) {
        console.error('فشل التشغيل بسبب التشفير:', error);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);
  </script>
</body>
</html>
