<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Cartoon Network Arabic - Live</title>
  <!-- Shaka Player UI CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
  <!-- Shaka Player JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
</head>
<body style="margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div data-shaka-player-container style="width: 100%; max-width: 900px;">
    <video data-shaka-player id="video" style="width:100%; height:100%;" autoplay></video>
  </div>

  <script>
    async function initPlayer() {
      const video = document.getElementById('video');
      const ui = video['ui'];
      const controls = ui.getControls();
      const player = controls.getPlayer();

      // رابط ملف DASH MPD
      const manifestUri = 'https://ev-eu-hw-fast-mpd.starzplayarabia.com/Cartoon_Network_Arabic/dash/drm/index.mpd';

      // إعدادات الـ DRM (يجب إضافة سيرفر التراخيص License Server الخاص بـ Starzplay)
      player.configure({
        drm: {
          servers: {
            'com.widevine.alpha': 'https://YOUR_LICENSE_SERVER_URL_HERE' // ضع رابط سيرفر التراخيص هنا
          }
        }
      });

      try {
        await player.load(manifestUri);
        console.log('تم تحميل البث بنجاح!');
      } catch (error) {
        console.error('خطأ في تشغيل البث:', error);
      }
    }

    document.addEventListener('shaka-ui-loaded', initPlayer);
  </script>
</body>
</html>
