<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المدمج السريع</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبة Hls.js للتشغيل الحقيقي والسريع -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-player {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* زر التشغيل الكبير في المنتصف */
        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            transition: transform 0.2s, background 0.2s;
        }

        .big-play-btn:active {
            background: rgba(0, 0, 0, 0.95);
            transform: translate(-50%, -50%) scale(0.92);
        }

        /* مؤشر تحميل عصري وجديد (Pulse Wave Loader) */
        .modern-loader {
            position: absolute;
            width: 65px;
            height: 65px;
            display: none;
            z-index: 1000;
            pointer-events: none;
        }

        .modern-loader div {
            position: absolute;
            border: 3px solid #00d2ff;
            opacity: 1;
            border-radius: 50%;
            animation: pulseWave 1.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .modern-loader div:nth-child(2) {
            animation-delay: -0.6s;
        }

        @keyframes pulseWave {
            0% {
                top: 30px;
                left: 30px;
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                top: 0px;
                left: 0px;
                width: 60px;
                height: 60px;
                opacity: 0;
            }
        }

        /* شريط التحكم */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.9), transparent);
            padding: 15px 15px 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 1;
            transition: opacity 0.15s ease-in-out;
            z-index: 500;
            pointer-events: auto;
        }

        .controls.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* شريط التقدم */
        .dots-progress-container {
            width: 100%;
            height: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .dots-bar {
            width: 100%;
            height: 5px;
            display: flex;
            gap: 2px;
            align-items: center;
            pointer-events: none;
        }

        .dot-unit {
            flex: 1;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 1px;
        }

        .dot-unit.active {
            background: #00d2ff;
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="custom-player" id="player-container" onclick="toggleControls()">
        <!-- مؤشر التحميل العصري -->
        <div class="modern-loader" id="spinner">
            <div></div>
            <div></div>
        </div>

        <!-- زر التشغيل الكبير -->
        <div class="big-play-btn" id="big-play-btn" onclick="startPlayback(event)">
            <i class="fa-solid fa-play"></i>
        </div>

        <video id="main-video" playsinline></video>

        <!-- عناصر التحكم -->
        <div class="controls" id="controls" onclick="event.stopPropagation()">
            <div class="dots-progress-container" id="dots-progress">
                <div class="dots-bar" id="dots-bar"></div>
            </div>

            <div class="buttons-row">
                <div class="left-controls">
                    <button class="btn" id="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
                    <button class="btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volume-icon"></i></button>
                    <span id="time-display" style="font-size: 12px; color: #ddd;">00:00 / 00:00</span>
                </div>

                <div class="right-controls">
                    <button class="btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('main-video');
        const spinner = document.getElementById('spinner');
        const bigPlayBtn = document.getElementById('big-play-btn');
        const dotsBar = document.getElementById('dots-bar');
        const playBtn = document.getElementById('play-btn');
        const controls = document.getElementById('controls');
        const TOTAL_DOTS = 40;
        let hideTimeout;
        let hls = null;
        let hasStarted = false;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const streamUrl = urlParams.get('src');

            bigPlayBtn.style.display = 'flex';

            if (streamUrl) {
                initStream(streamUrl);
            }
        });

        (function initDots() {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < TOTAL_DOTS; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot-unit';
                fragment.appendChild(dot);
            }
            dotsBar.appendChild(fragment);
        })();

        function toggleControls() {
            if (!hasStarted) return;
            if (controls.classList.contains('hide')) {
                showControls();
            } else {
                controls.classList.add('hide');
            }
        }

        function showControls() {
            controls.classList.remove('hide');
            clearTimeout(hideTimeout);
            if (!video.paused) {
                hideTimeout = setTimeout(() => {
                    controls.classList.add('hide');
                }, 3000);
            }
        }

        // تهيئة البث مع أقصى تحسينات السرعة وتقليل التقطيع
        function initStream(url) {
            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (url.includes('.m3u8') || url.includes('m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls({ 
                        maxBufferLength: 60,            /* زيادة التخزين المؤقت إلى 60 ثانية لتفادي التقطيع */
                        maxMaxBufferLength: 120,
                        maxBufferSize: 60 * 1024 * 1024, /* استهلاك ذاكرة مجدي لحفظ الأجزاء */
                        liveSyncDurationCount: 3,
                        enableWorker: true,             /* تشغيل المعالجة في الخلفية لتسريع الأداء */
                        lowLatencyMode: true,           /* تقليل زمن التأخير */
                        backBufferLength: 30
                    });
                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
            } else {
                video.src = url;
                video.load();
            }
        }

        function startPlayback(event) {
            event.stopPropagation();
            hasStarted = true;
            bigPlayBtn.style.display = 'none';
            showSpinner(true);

            video.play().then(() => {
                showSpinner(false);
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                showControls();
            }).catch(() => {
                showSpinner(false);
            });
        }

        video.addEventListener('timeupdate', () => {
            if (!video.duration || isNaN(video.duration)) return;
            const percentage = video.currentTime / video.duration;
            const activeCount = Math.floor(percentage * TOTAL_DOTS);
            const dots = dotsBar.children;

            for (let i = 0; i < TOTAL_DOTS; i++) {
                dots[i].classList.toggle('active', i <= activeCount);
            }

            document.getElementById('time-display').innerText = 
                `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        document.getElementById('dots-progress').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percentage = (e.clientX - rect.left) / rect.width;
            if (video.duration && !isNaN(video.duration)) {
                video.currentTime = percentage * video.duration;
            }
        });

        function togglePlay() {
            if (!hasStarted) return;
            if (video.paused) {
                video.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                showControls();
            } else {
                video.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                controls.classList.remove('hide');
                clearTimeout(hideTimeout);
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById('volume-icon').className = video.muted ? 
                'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        }

        function toggleFullscreen() {
            const container = document.getElementById('player-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().then(() => {
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }).catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                    screen.orientation.unlock();
                }
            }
        }

        video.addEventListener('waiting', () => showSpinner(true));
        video.addEventListener('playing', () => {
            showSpinner(false);
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        });

        video.addEventListener('error', () => {
            showSpinner(false);
        });

        function showSpinner(show) {
            spinner.style.display = show ? 'block' : 'none';
        }

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
