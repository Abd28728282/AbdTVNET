<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - فلسطين التعليمية</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- تم إزالة خاصية muted ليعمل الصوت، وتم وضع autoplay و playsinline -->
    <video id="liveVideo" autoplay playsinline controls></video>

    <script>
        var video = document.getElementById('liveVideo');
        var videoSrc = 'https://pbc.furrera.ps/PalestineEDU/index.m3u8';

        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.play().catch(function(error) {
                console.log("Autoplay blocked, attempting interaction fallback:", error);
            });
        } else if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log("Autoplay blocked, attempting interaction fallback:", error);
                });
            });
        }

        // محاولة تشغيل إضافية عند أي تفاعل أو لمسة للشاشة إن لزم الأمر
        window.addEventListener('click', function() {
            if (video.paused) {
                video.play();
            }
        }, { once: true });
    </script>

</body>
</html>
